<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axios Cleaner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12.00" cy="2.50" r="1.6" fill="#FF2448" fill-opacity="0.35"/><circle cx="16.75" cy="3.77" r="1.6" fill="#FF2448" fill-opacity="0.40"/><circle cx="20.23" cy="7.25" r="1.6" fill="#FF2448" fill-opacity="0.46"/><circle cx="21.50" cy="12.00" r="1.6" fill="#FF2448" fill-opacity="0.51"/><circle cx="20.23" cy="16.75" r="1.6" fill="#FF2448" fill-opacity="0.57"/><circle cx="16.75" cy="20.23" r="1.6" fill="#FF2448" fill-opacity="0.62"/><circle cx="12.00" cy="21.50" r="1.6" fill="#FF2448" fill-opacity="0.68"/><circle cx="7.25" cy="20.23" r="1.6" fill="#FF2448" fill-opacity="0.73"/><circle cx="3.77" cy="16.75" r="1.6" fill="#FF2448" fill-opacity="0.78"/><circle cx="2.50" cy="12.00" r="1.6" fill="#FF2448" fill-opacity="0.84"/><circle cx="3.77" cy="7.25" r="1.6" fill="#FF2448" fill-opacity="0.89"/><circle cx="7.25" cy="3.77" r="1.6" fill="#FF2448" fill-opacity="0.95"/><rect x="8" y="8.899999999999999" width="8" height="1.8" rx="0.9" fill="#EDEDED"/><rect x="8" y="13.3" width="8" height="1.8" rx="0.9" fill="#EDEDED"/></svg>
        <span class="mono" data-tauri-drag-region>Axios<b>//</b>Cleaner</span>
        <span class="ver mono" id="ver" data-tauri-drag-region></span>
      </div>
      <div class="readout mono" id="readout" data-tauri-drag-region>sys :: aguardando sensores</div>
      <button class="upd-pill mono" id="updPill" data-openupdate hidden></button>
      <div class="status mono" data-tauri-drag-region>
        <span class="ok-led" id="statusLed"></span>
        <span id="statusText">Iniciando</span>
      </div>
      <div class="clock mono" id="clock" data-tauri-drag-region>--:--:--</div>
      <div class="winctl">
        <button id="wMin" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
        <button id="wMax" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button>
        <button id="wClose" class="close" title="Fechar" aria-label="Fechar"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
      </div>
    </header>

    <div class="body">
      <nav class="channels" id="channels" aria-label="Canais"></nav>
      <main class="screen" id="screen"></main>
    </div>
  </div>

  <div id="modal"></div>
  <div class="boot" id="boot" aria-hidden="true"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
